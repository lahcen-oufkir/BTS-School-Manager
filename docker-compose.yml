name: bts-school-manager

# Production-oriented Docker Compose.
# Copy .env.example to .env and set strong secrets (DB_PASSWORD, REDIS_PASSWORD, APP_KEY).

services:
  database:
    image: postgres:16-alpine
    container_name: bts_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bts_school}
      POSTGRES_USER: ${DB_USERNAME:-bts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bts} -d ${DB_DATABASE:-bts_school}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: bts_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:?}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: bts_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "BTS School Manager"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?APP_KEY must be set in .env (run: php artisan key:generate)}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_LOCALE: fr
      APP_FALLBACK_LOCALE: fr
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bts_school}
      DB_USERNAME: ${DB_USERNAME:-bts}
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set in .env}"
      FILESYSTEM_DISK: local
      SEED_DEMO: ${SEED_DEMO:-false}
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_storage:/var/www/html/storage/app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/v1/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}"
    container_name: bts_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  backend_storage: